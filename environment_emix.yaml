name: omnislam

channels:
  - conda-forge
  - defaults

dependencies:
  # --- Core ---
  - python=3.9
  - pip

  # --- CUDA stack (conda-managed, do NOT rely on system CUDA) ---
  - cudatoolkit=11.2
  - cudnn=8.1

  # --- Python packages ---
  - pip:
      # Numerical stack (NumPy < 2 is CRITICAL)
      - numpy==1.23.5
      - matplotlib==3.6.3

      # Vision & utils
      - opencv-python==4.7.0.72
      - Pillow==9.5.0
      - gdown==4.7.1

      # ML frameworks
      - tensorflow==2.11.0
      - torch==2.0.1

